<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/vite.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>NEET Biology Revision Portal — Class 11</title>
    <meta name="description" content="High-yield NCERT notes, interactive flashcards, and practice MCQs for Class 11 NEET Biology." />
    
    <!-- Open Graph / Social Media Meta -->
    <meta property="og:title" content="NEET Biology Revision Portal — Class 11" />
    <meta property="og:description" content="High-yield NCERT notes, interactive flashcards, and practice MCQs for Class 11 NEET Biology." />
    <meta property="og:type" content="website" />

    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet" />

    <style>
      /* Fallback CSS for loading spinner before Tailwind loads */
      .initial-loader-wrapper {
        min-height: 100vh;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        background-color: #090d16;
        color: #94a3b8;
        font-family: 'Inter', system-ui, -apple-system, sans-serif;
      }
      .spinner {
        width: 40px;
        height: 40px;
        border: 3px solid rgba(16, 185, 129, 0.15);
        border-top-color: #10b981;
        border-radius: 50%;
        animation: spin 0.8s linear infinite;
      }
      @keyframes spin {
        to { transform: rotate(360deg); }
      }
    </style>
  </head>
  <body class="bg-slate-50 text-slate-900 antialiased selection:bg-emerald-500 selection:text-white">
    <div id="root">
      <!-- Fallback loader displayed while React mounts -->
      <div class="initial-loader-wrapper">
        <div class="spinner"></div>
        <p style="margin-top: 16px; font-size: 13px; font-weight: 500; letter-spacing: 0.025em; color: #64748b;">
          Loading Portal...
        </p>
      </div>
    </div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
